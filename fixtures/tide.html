<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture — tide illustration</title>
    <link rel="stylesheet" href="../styles/tide.css" />
    <style>
      /* Fixture-only chrome. Nothing here is part of the component. */
      :root {
        /* So Canvas/CanvasText follow the system palette and the component is
         * reviewed against a matching page background. */
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 1rem;
        font: 16px/1.5 system-ui, sans-serif;
        background: Canvas;
        color: CanvasText;
        overflow-wrap: anywhere;
      }
      h1 {
        font-size: 1.25rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
        gap: 1.5rem;
        margin-bottom: 2.5rem;
      }
      .case > h2 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.7;
        margin: 0 0 0.5rem;
      }
      .phone {
        /* A 320px phone column that never itself overflows a narrow window. */
        width: min(320px, 100%);
        box-sizing: border-box;
        padding: 0.75rem;
        border: 1px dashed currentColor;
        border-radius: 0.5rem;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      .controls label {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h1>Tide illustration fixtures</h1>
    <p>
      Check each state in both light and dark system palettes, with
      <code>prefers-reduced-motion</code> on and off, and at a 320px viewport.
    </p>

    <div class="grid">
      <section class="case"><h2>0 of 120 — empty</h2><div data-case="0"></div></section>
      <section class="case"><h2>60 of 120 — half</h2><div data-case="60"></div></section>
      <section class="case"><h2>120 of 120 — full, glow</h2><div data-case="120"></div></section>
      <section class="case"><h2>310 of 120 — above goal, truthful total</h2><div data-case="310"></div></section>
      <section class="case"><h2>45 of 90 — edited goal</h2><div data-case="45/90"></div></section>
    </div>

    <h2>Interactive</h2>
    <div class="controls">
      <label>minutes <input id="minutes" type="range" min="0" max="300" value="48" /></label>
      <label>goal <input id="goal" type="number" min="1" max="600" value="120" /></label>
      <output id="live"></output>
    </div>
    <div class="phone"><div id="interactive"></div></div>

    <script type="module">
      import { createTide, formatTideLabel } from '../src/tide.mjs';

      for (const host of document.querySelectorAll('[data-case]')) {
        const [minutes, goal = 120] = host.dataset.case.split('/').map(Number);
        createTide(host).update({ minutes, goal });
      }

      const tide = createTide(document.getElementById('interactive'));
      const minutesInput = document.getElementById('minutes');
      const goalInput = document.getElementById('goal');
      const live = document.getElementById('live');

      function render() {
        const state = tide.update({
          minutes: Number(minutesInput.value),
          goal: Number(goalInput.value),
        });
        live.textContent = formatTideLabel(state);
      }

      minutesInput.addEventListener('input', render);
      goalInput.addEventListener('input', render);
      render();
    </script>
  </body>
</html>
